<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="16" fill="#1e1b17"/>

  <!-- Book left page -->
  <path d="M64 34 C52 32 30 28 18 34 V92 C30 86 52 90 64 98Z"
        fill="#c8a84e" fill-opacity="0.06" stroke="#c8a84e" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Book right page -->
  <path d="M64 34 C76 32 98 28 110 34 V92 C98 86 76 90 64 98Z"
        fill="#c8a84e" fill-opacity="0.06" stroke="#c8a84e" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Stopwatch body (circle) -->
  <circle cx="64" cy="58" r="22" fill="#1e1b17" stroke="#dcc075" stroke-width="3.5"/>
  <!-- Inner ring -->
  <circle cx="64" cy="58" r="17" fill="none" stroke="#c8a84e" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Stopwatch crown/button -->
  <rect x="61" y="32" width="6" height="6" rx="1.5" fill="#dcc075"/>
  <!-- Crown stem -->
  <line x1="64" y1="36" x2="64" y2="38" stroke="#a08530" stroke-width="2" stroke-linecap="round"/>

  <!-- Side button -->
  <line x1="79" y1="42" x2="83" y2="38" stroke="#dcc075" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Hour markers -->
  <line x1="64" y1="40" x2="64" y2="44" stroke="#c8a84e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="64" y1="72" x2="64" y2="76" stroke="#c8a84e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="46" y1="58" x2="50" y2="58" stroke="#c8a84e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="78" y1="58" x2="82" y2="58" stroke="#c8a84e" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Minute hand -->
  <line x1="64" y1="58" x2="64" y2="44" stroke="#dcc075" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Hour hand -->
  <line x1="64" y1="58" x2="74" y2="52" stroke="#dcc075" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Second hand -->
  <line x1="64" y1="58" x2="58" y2="70" stroke="#e8c252" stroke-width="1" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="64" cy="58" r="2.5" fill="#dcc075"/>
  <circle cx="64" cy="58" r="1.2" fill="#a08530"/>
</svg>
