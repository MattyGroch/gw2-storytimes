<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GW2 Story Times</title>
    <meta name="description" content="Community-driven completion times for every Guild Wars 2 story mission">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #13110f; color: #e8e0d6; }
        .gw2-gradient { background: linear-gradient(135deg, #c8a84e 0%, #8a6b2d 100%); }
        .card-bg { background-color: #1e1b17; }
        .progress-bar-bg { background-color: #3a352e; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #13110f; }
        ::-webkit-scrollbar-thumb { background: #4a443a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b6355; }
        @keyframes search-highlight {
            0%   { box-shadow: 0 0 0 2px rgba(200, 168, 78, 0.6), 0 0 12px rgba(200, 168, 78, 0.25); }
            100% { box-shadow: 0 0 0 0px rgba(200, 168, 78, 0), 0 0 0px rgba(200, 168, 78, 0); }
        }
        .search-highlight { animation: search-highlight 1.5s ease-out forwards; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gw2: { gold: '#c8a84e', 'gold-light': '#dcc075', 'gold-dark': '#8a6b2d' }
                    },
                    fontFamily: { display: ['Cinzel', 'serif'] }
                }
            }
        }
    </script>
</head>

    // --- Icons (inline SVG, Lucide-style) ---

    function IconBase({ children, size = 24, className = '' }) {
        return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
            fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
            className={className}>{children}</svg>;
    }
    function ChevronDown(p) { return <IconBase {...p}><polyline points="6 9 12 15 18 9"/></IconBase>; }
    function ChevronUp(p) { return <IconBase {...p}><polyline points="18 15 12 9 6 15"/></IconBase>; }
    function Clock(p) { return <IconBase {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconBase>; }
    function Send(p) { return <IconBase {...p}><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></IconBase>; }
    function BookOpen(p) { return <IconBase {...p}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></IconBase>; }
    function Zap(p) { return <IconBase {...p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></IconBase>; }
    function Info(p) { return <IconBase {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></IconBase>; }
    function CheckCircle(p) { return <IconBase {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconBase>; }
    function AlertCircle(p) { return <IconBase {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></IconBase>; }
    function ArrowLeft(p) { return <IconBase {...p}><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></IconBase>; }
    function MenuIcon(p) { return <IconBase {...p}><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="18" x2="20" y2="18"/></IconBase>; }
    function SearchIcon(p) { return <IconBase {...p}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></IconBase>; }
    function X(p) { return <IconBase {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconBase>; }

    // --- Utility ---

    function formatTime(mins) {
        if (mins == null) return '—';
        if (mins < 60) return `${Math.round(mins)}m`;
        const h = Math.floor(mins / 60);
        const m = Math.round(mins % 60);
        return m > 0 ? `${h}h ${m}m` : `${h}h`;
    }

    function formatTimeVerbose(mins) {
        if (mins == null) return 'No data';
        if (mins < 60) return `${Math.round(mins)} minutes`;
        const h = Math.floor(mins / 60);
        const m = Math.round(mins % 60);
        return m > 0 ? `${h} hr ${m} min` : `${h} hr`;
    }

    function slugify(str) {
        return str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    }

    async function apiFetch(path) {
        const res = await fetch(`${API_BASE}${path}`);
        if (!res.ok) throw new Error(`API error: ${res.status}`);
        return res.json();
    }

    // --- Components ---

    function Navbar({ onNavigate, view }) {
        const [showSiteMenu, setShowSiteMenu] = useState(false);
        const siteMenuRef = useRef(null);
        useEffect(() => {
            if (!showSiteMenu) return;
            const handler = (e) => {
                if (siteMenuRef.current && !siteMenuRef.current.contains(e.target)) setShowSiteMenu(false);
            };
            document.addEventListener('mousedown', handler);
            return () => document.removeEventListener('mousedown', handler);
        }, [showSiteMenu]);

        const [query, setQuery] = useState('');
        const [searchData, setSearchData] = useState(null);
        const [loadingSearch, setLoadingSearch] = useState(false);
        const [dropdownOpen, setDropdownOpen] = useState(false);
        const searchRef = useRef(null);

        useEffect(() => {
            if (!dropdownOpen) return;
            const handler = (e) => {
                if (searchRef.current && !searchRef.current.contains(e.target)) setDropdownOpen(false);
            };
            document.addEventListener('mousedown', handler);
            return () => document.removeEventListener('mousedown', handler);
        }, [dropdownOpen]);

        function handleSearchFocus() {
            setDropdownOpen(true);
            if (!searchData && !loadingSearch) {
                setLoadingSearch(true);
                apiFetch('/missions').then(data => {
                    const storyMap = new Map();
                    for (const m of data) {
                        if (!storyMap.has(m.story_name)) {
                            storyMap.set(m.story_name, {
                                type: 'story',
                                name: m.story_name,
                                season_id: m.season_id,
                                season_name: m.season_name,
                                group_name: m.group_name,
                                mission_count: 0,
                            });
                        }
                        storyMap.get(m.story_name).mission_count++;
                    }
                    setSearchData({ missions: data, stories: Array.from(storyMap.values()) });
                    setLoadingSearch(false);
                }).catch(() => setLoadingSearch(false));
            }
        }

        function handleKeyDown(e) {
            if (e.key === 'Escape') {
                setDropdownOpen(false);
                setQuery('');
                e.target.blur();
            }
        }

        function selectResult(r) {
            if (r.type === 'story') {
                onNavigate('season', r.season_id, null, { type: 'story', name: r.name });
            } else {
                onNavigate('mission', r.id, r.season_id, { type: 'mission' });
            }
            setDropdownOpen(false);
            setQuery('');
        }

        const results = useMemo(() => {
            if (!searchData || query.length < 2) return [];
            const q = query.toLowerCase();
            const storyHits = searchData.stories
                .filter(s => s.name.toLowerCase().includes(q))
                .slice(0, 3)
                .map(s => ({ ...s, key: 'story-' + s.name }));
            const missionHits = searchData.missions
                .filter(m => m.name.toLowerCase().includes(q))
                .slice(0, 8)
                .map(m => ({ ...m, type: 'mission', key: 'mission-' + m.id }));
            return [...storyHits, ...missionHits];
        }, [searchData, query]);

        const showDropdown = dropdownOpen && query.length >= 2;

        return (
            <nav className="card-bg border-b border-stone-800 sticky top-0 z-50">
                <div className="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
                    <div className="flex items-center gap-3 shrink-0">
                        <div className="relative" ref={siteMenuRef}>
                            <button onClick={() => setShowSiteMenu(p => !p)}
                                className={`p-1 rounded transition-colors ${showSiteMenu ? 'text-gw2-gold' : 'text-gray-400 hover:text-gw2-gold-light'}`}
                                title="Switch site">
                                <MenuIcon size={20} />
                            </button>
                            {showSiteMenu && (
                                <div className="absolute left-0 top-full mt-2 z-30 w-56 card-bg border border-stone-700 rounded-lg shadow-xl p-2">
                                    <a href="https://gw2storytracker.com"
                                        className="flex items-center gap-3 px-3 py-2 rounded-md text-gray-300 text-sm hover:bg-white/5 hover:text-gw2-gold-light transition-colors">
                                        <img src="https://gw2storytracker.com/logo.svg" alt="" className="w-5 h-5 rounded" />
                                        GW2 Story Tracker
                                    </a>
                                    <a href="https://gw2storytimes.com"
                                        className="flex items-center gap-3 px-3 py-2 rounded-md bg-gw2-gold-dark/20 text-gw2-gold-light text-sm font-medium mt-1">
                                        <img src="logo.svg" alt="" className="w-5 h-5 rounded" />
                                        GW2 Story Times
                                    </a>
                                </div>
                            )}
                        </div>
                        <button onClick={() => onNavigate('home')} className="flex items-center gap-3 hover:opacity-80 transition-opacity">
                            <img src="logo.svg" alt="GW2 Story Times" className="w-8 h-8 rounded" />
                            <span className="font-bold text-xl hidden sm:inline font-display" style={{color:'#e8e0d6'}}>GW2 Story Times</span>
                            <span className="font-bold text-lg sm:hidden font-display" style={{color:'#e8e0d6'}}>Story Times</span>
                        </button>
                    </div>
                    <div className="flex items-center gap-3 sm:gap-4">
                        <div className="relative" ref={searchRef}>
                            <div className="relative">
                                <SearchIcon size={14} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none" />
                                <input
                                    type="text"
                                    value={query}
                                    onChange={e => { setQuery(e.target.value); setDropdownOpen(true); }}
                                    onFocus={handleSearchFocus}
                                    onKeyDown={handleKeyDown}
                                    placeholder="Search missions & stories..."
                                    className="bg-stone-800 border border-stone-700 rounded-lg pl-8 pr-7 py-1.5 text-xs text-gray-200 w-40 sm:w-56 focus:outline-none focus:border-gw2-gold-dark transition-colors"
                                />
                                {query && (
                                    <button onClick={() => { setQuery(''); setDropdownOpen(false); }} className="absolute right-1.5 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300">
                                        <X size={14} />
                                    </button>
                                )}
                            </div>
                            {showDropdown && (
                                <div className="absolute right-0 top-full mt-2 z-50 w-72 sm:w-80 card-bg border border-stone-700 rounded-lg shadow-xl overflow-hidden">
                                    {loadingSearch ? (
                                        <div className="px-3 py-4 text-xs text-gray-500 text-center">Loading...</div>
                                    ) : results.length === 0 ? (
                                        <div className="px-3 py-4 text-xs text-gray-500 text-center">No results found</div>
                                    ) : (
                                        <div className="max-h-80 overflow-y-auto">
                                            {results.map(r => (
                                                <button
                                                    key={r.key}
                                                    onClick={() => selectResult(r)}
                                                    className="w-full text-left px-3 py-2 hover:bg-white/5 transition-colors border-b border-stone-800 last:border-b-0 flex items-start gap-2.5"
                                                >
                                                    {r.type === 'story' ? (
                                                        <React.Fragment>
                                                            <div className="shrink-0 mt-0.5 w-5 h-5 rounded flex items-center justify-center"
                                                                style={{ background: (STORY_COLORS[r.season_name] || '#c8a84e') + '30', color: STORY_COLORS[r.season_name] || '#c8a84e' }}>
                                                                <BookOpen size={12} />
                                                            </div>

    function questListTime(list, findMission) {
        let total = 0;
        for (const entry of list) {
            if (Array.isArray(entry)) {
                let s = 0, n = 0;
                for (const alt of entry) {
                    const m = findMission(alt);
                    if (m?.times?.full?.avg_mins) { s += m.times.full.avg_mins; n++; }
                }
                if (n > 0) total += s / n;
            } else {
                const m = findMission(entry);
                if (m?.times?.full?.avg_mins) total += m.times.full.avg_mins;
            }
        }
        return total;
    }

            setSubmitting(true);

                    setStatus({ type: 'error', message: data.error || 'Submission failed' });

                    setStatus({ type: 'success', message: 'Time submitted!' });
                    setDuration('');
                    if (onSubmitted) onSubmitted();

    // Collapse race-variant duplicates (e.g. SotO/JW prologues) into one mission
    function deduplicateMissions(missions) {
        const seen = new Map();
        for (const m of missions) {
            if (!seen.has(m.name)) { seen.set(m.name, { ...m, _count: 1 }); continue; }
            const existing = seen.get(m.name);
            existing._count++;
            const ef = existing.times?.full?.avg_mins || 0;
            const mf = m.times?.full?.avg_mins || 0;
            const es = existing.times?.speed?.avg_mins || 0;
            const ms = m.times?.speed?.avg_mins || 0;
            if (mf && ef) {
                existing.times = { ...existing.times, full: { ...existing.times.full, avg_mins: (ef * (existing._count - 1) + mf) / existing._count } };
            }
            if (ms && es) {
                existing.times = { ...existing.times, speed: { ...existing.times.speed, avg_mins: (es * (existing._count - 1) + ms) / existing._count } };
            }
        }
        return [...seen.values()];
    }

    // --- Playthrough stats (single-playthrough quest count & average path time) ---

    function countQuestList(list, byName) {
        let quests = 0, fullMins = 0, speedMins = 0;
        for (const entry of list) {
            quests += 1;
            if (Array.isArray(entry)) {
                let af = 0, as = 0, n = 0;
                for (const alt of entry) {
                    const mi = byName[alt];
                    if (mi) { af += mi.times?.full?.avg_mins || 0; as += mi.times?.speed?.avg_mins || 0; n++; }
                }
                if (n > 0) { fullMins += af / n; speedMins += as / n; }
            } else {
                const mi = byName[entry];
                if (mi) { fullMins += mi.times?.full?.avg_mins || 0; speedMins += mi.times?.speed?.avg_mins || 0; }
            }
        }
        return { quests, fullMins, speedMins };
    }

    function storyPlaythroughStats(story) {
        const pd = BIOGRAPHY_PATHS[story.id];
        if (!pd) {
            return {
                quests: story.missions.length,
                fullMins: story.missions.reduce((acc, m) => acc + (m.times?.full?.avg_mins || 0), 0),
                speedMins: story.missions.reduce((acc, m) => acc + (m.times?.speed?.avg_mins || 0), 0),
            };
        }
        const byName = {};
        for (const mi of story.missions) byName[mi.name] = mi;
        let quests = 0, fullMins = 0, speedMins = 0;
        for (const part of pd.parts) {
            const sh = countQuestList(part.shared, byName);
            quests += sh.quests; fullMins += sh.fullMins; speedMins += sh.speedMins;

            const pKeys = Object.keys(part.paths);
            if (pKeys.length > 0) {
                const firstPath = countQuestList(part.paths[pKeys[0]], byName);
                quests += firstPath.quests;
                let pf = 0, ps = 0;
                for (const pk of pKeys) {
                    const s = countQuestList(part.paths[pk], byName);
                    pf += s.fullMins; ps += s.speedMins;
                }
                fullMins += pf / pKeys.length;
                speedMins += ps / pKeys.length;
            }

            if (part.sharedTail) {
                const tail = countQuestList(part.sharedTail, byName);
                quests += tail.quests; fullMins += tail.fullMins; speedMins += tail.speedMins;
            }
        }
        return { quests: quests, fullMins: fullMins, speedMins: speedMins };
    }

    function computePlaythroughStats(storyList) {
        const raceGroups = {};
        const sharedList = [];
        for (const story of storyList) {
            if (story.races && story.races.length > 0) {
                for (const race of story.races) {
                    if (!raceGroups[race]) raceGroups[race] = [];
                    raceGroups[race].push(story);
                }
            } else {
                sharedList.push(story);
            }
        }
        let tq = 0, tf = 0, ts = 0;
        for (const story of sharedList) {
            const stats = storyPlaythroughStats(story);
            tq += stats.quests;
            tf += stats.fullMins;
            ts += stats.speedMins;
        }
        const raceKeys = Object.keys(raceGroups);
        if (raceKeys.length > 0) {
            let rq = 0, rf = 0, rs = 0;
            for (const race of raceKeys) {
                for (const story of raceGroups[race]) {
                    const stats = storyPlaythroughStats(story);
                    rq += stats.quests;
                    rf += stats.fullMins;
                    rs += stats.speedMins;
                }
            }
            tq += rq / raceKeys.length;
            tf += rf / raceKeys.length;
            ts += rs / raceKeys.length;
        }
        return { quests: Math.round(tq), fullMins: tf, speedMins: ts };
    }

    function HomeView({ onSelectSeason }) {
        const [seasons, setSeasons] = useState(null);
        const [error, setError] = useState(null);

        useEffect(() => {
            Promise.all([
                apiFetch('/seasons'),
                apiFetch('/seasons/' + MY_STORY_SEASON_ID),
                ...DEDUP_SEASON_IDS.map(id => apiFetch('/seasons/' + id))
            ]).then(function(results) {
                var allSeasons = results[0];
                var myStory = results[1];
                var adjusted = computePlaythroughStats(myStory.stories);
                var dedupMap = {};
                for (var i = 0; i < DEDUP_SEASON_IDS.length; i++) {
                    var sd = results[2 + i];
                    var mc = 0, tf = 0, ts = 0;
                    for (var j = 0; j < sd.stories.length; j++) {
                        var dm = deduplicateMissions(sd.stories[j].missions);
                        mc += dm.length;
                        for (var k = 0; k < dm.length; k++) {
                            tf += dm[k].times?.full?.avg_mins || 0;
                            ts += dm[k].times?.speed?.avg_mins || 0;
                        }
                    }
                    dedupMap[DEDUP_SEASON_IDS[i]] = { mission_count: mc, total_full_mins: tf, total_speed_mins: ts };
                }
                setSeasons(allSeasons.map(function(se) {
                    if (se.id === MY_STORY_SEASON_ID) {
                        return Object.assign({}, se, {
                            mission_count: adjusted.quests,
                            total_full_mins: adjusted.fullMins,
                            total_speed_mins: adjusted.speedMins
                        });
                    }
                    if (dedupMap[se.id]) {
                        return Object.assign({}, se, dedupMap[se.id]);
                    }
                    return se;
                }));
            }).catch(function(err) { setError(err.message || String(err)); });
        }, []);

        if (error) return <ErrorBox message={error} />;
        if (!seasons) return <Loading />;

        return (
            <div>
                <TotalSummary seasons={seasons} />
                <div className="space-y-3">
                    {seasons.map(s => (
                        <SeasonCard key={s.id} season={s} onSelectSeason={onSelectSeason} />
                    ))}
                </div>
            </div>
        );
    }

    function parseRoute(pathname, slugToId) {
        const parts = pathname.replace(/^\/+|\/+$/g, '').split('/').filter(Boolean);
        if (parts.length === 0) return { view: 'home', viewId: null, seasonId: null };
        if (parts[0] === 'about') return { view: 'about', viewId: null, seasonId: null };
        const seasonId = slugToId[parts[0]];
        if (!seasonId) return { view: 'home', viewId: null, seasonId: null };
        if (parts.length >= 2) {
            const missionId = parseInt(parts[1], 10);
            if (!isNaN(missionId)) return { view: 'mission', viewId: missionId, seasonId };
        }
        return { view: 'season', viewId: seasonId, seasonId };
    }

        const [view, setView] = useState('home');
        const [viewId, setViewId] = useState(null);
        const [currentSeasonId, setCurrentSeasonId] = useState(null);
        const [highlight, setHighlight] = useState(null);
        const [slugToId, setSlugToId] = useState(null);
        const [idToSlug, setIdToSlug] = useState({});

        useEffect(() => {
            apiFetch('/seasons').then(seasons => {
                const s2id = {};
                const id2s = {};
                for (const s of seasons) {
                    const slug = slugify(s.name);
                    s2id[slug] = s.id;
                    id2s[s.id] = slug;
                }
                setSlugToId(s2id);
                setIdToSlug(id2s);

                const route = parseRoute(window.location.pathname, s2id);
                setView(route.view);
                setViewId(route.viewId);
                setCurrentSeasonId(route.seasonId);

                window.history.replaceState({ view: route.view, viewId: route.viewId, seasonId: route.seasonId }, '');
            }).catch(() => {
                setSlugToId({});
            });
        }, []);

        useEffect(() => {
            if (!slugToId) return;
            function handlePopState(e) {
                const state = e.state;
                if (state) {
                    setView(state.view || 'home');
                    setViewId(state.viewId || null);
                    setCurrentSeasonId(state.seasonId || null);
                } else {
                    const route = parseRoute(window.location.pathname, slugToId);
                    setView(route.view);
                    setViewId(route.viewId);
                    setCurrentSeasonId(route.seasonId);
                }
                window.scrollTo(0, 0);
            }
            window.addEventListener('popstate', handlePopState);
            return () => window.removeEventListener('popstate', handlePopState);
        }, [slugToId]);

        function navigate(v, id = null, seasonCtx = null, highlightCtx = null) {
            let path = '/';
            let seasonId = currentSeasonId;
            if (v === 'about') {
                path = '/about';
                seasonId = null;
            } else if (v === 'season') {
                path = '/' + (idToSlug[id] || id);
                seasonId = id;
            } else if (v === 'mission') {
                const sid = seasonCtx || currentSeasonId;
                const slug = idToSlug[sid] || 'mission';
                path = '/' + slug + '/' + id;
                seasonId = sid;
            } else if (v === 'home') {
                seasonId = null;
            }

            const state = { view: v, viewId: id, seasonId };
            window.history.pushState(state, '', path);
            setView(v);
            setViewId(id);
            setCurrentSeasonId(seasonId);
            setHighlight(highlightCtx);
            window.scrollTo(0, 0);
        }

        function goBack() {
            window.history.back();
        }

        if (slugToId === null) return (
            <div className="min-h-screen pb-12">
                <Navbar onNavigate={() => {}} view="home" />
                <div className="max-w-4xl mx-auto px-4 py-8"><Loading /></div>
            </div>
        );

        return (
            <div className="min-h-screen pb-12">
                <Navbar onNavigate={navigate} view={view} />
                <div className="max-w-4xl mx-auto px-4 py-8">
                    {view === 'home' && <HomeView onSelectSeason={(id) => navigate('season', id)} />}
                    {view === 'season' && <SeasonView seasonId={viewId} onSelectMission={(id) => navigate('mission', id)} onBack={goBack} highlight={highlight} onHighlightDone={() => setHighlight(null)} />}
                    {view === 'mission' && <MissionView missionId={viewId} onBack={goBack} highlight={highlight} onHighlightDone={() => setHighlight(null)} />}
                    {view === 'about' && <AboutView />}
                </div>
                <footer className="text-center text-xs text-gray-600 py-8">
                    <a href="https://github.com" className="hover:text-gray-400">GitHub</a>
                    {' · '}
                    <span>Data sourced from the <a href="https://wiki.guildwars2.com" className="hover:text-gray-400">GW2 Wiki</a> and community submissions</span>
                </footer>
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
