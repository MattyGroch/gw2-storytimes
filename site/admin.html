<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — GW2 Story Times</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gw2: { gold: '#c8a84e', 'gold-light': '#dcc075', 'gold-dark': '#8a6b2d' }
                    },
                    fontFamily: { display: ['Cinzel', 'serif'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #13110f; color: #e8e0d6; }
        .card-bg { background-color: #1e1b17; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #13110f; }
        ::-webkit-scrollbar-thumb { background: #4a443a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b6355; }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const API_BASE = window.location.origin + '/v1';

    function getToken() { return sessionStorage.getItem('admin_token') || ''; }
    function setToken(t) { sessionStorage.setItem('admin_token', t); }

    function adminFetch(path, opts = {}) {
        return fetch(`${API_BASE}/admin${path}`, {
            ...opts,
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${getToken()}`,
                ...(opts.headers || {}),
            },
        });
    }

    const SOURCE_BADGES = {
        manual:    { label: 'Manual',    bg: 'bg-sky-900/60',    text: 'text-sky-300' },
        sentiment: { label: 'Sentiment', bg: 'bg-purple-900/60', text: 'text-purple-300' },
        api:       { label: 'API',       bg: 'bg-amber-900/60',  text: 'text-amber-300' },
    };

    function SourceBadge({ source }) {
        const s = SOURCE_BADGES[source] || { label: source, bg: 'bg-stone-700', text: 'text-gray-300' };
        return <span className={`text-[10px] px-1.5 py-0.5 rounded font-medium ${s.bg} ${s.text}`}>{s.label}</span>;
    }

    function formatDate(iso) {
        if (!iso) return '—';
        const d = new Date(iso + 'Z');
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
            + ' ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    }

    function LoginForm({ onLogin }) {
        const [pass, setPass] = useState('');
        const [error, setError] = useState(null);
        const [loading, setLoading] = useState(false);

        async function handleSubmit(e) {
            e.preventDefault();
            if (!pass.trim()) return;
            setLoading(true);
            setError(null);
            setToken(pass.trim());
            try {
                const res = await adminFetch('/submissions?limit=1');
                if (res.ok) {
                    onLogin();
                } else {
                    setError('Invalid passphrase');
                    setToken('');
                }
            } catch {
                setError('Connection failed');
                setToken('');
            }
            setLoading(false);
        }

        return (
            <div className="min-h-screen flex items-center justify-center">
                <div className="card-bg rounded-lg border border-stone-800 p-8 w-full max-w-sm shadow-xl">
                    <h1 className="text-xl font-bold font-display text-center mb-6" style={{color:'#e8e0d6'}}>Admin Access</h1>
                    <form onSubmit={handleSubmit}>
                        <input
                            type="password"
                            value={pass}
                            onChange={e => setPass(e.target.value)}
                            placeholder="Enter passphrase"
                            className="w-full bg-stone-800 border border-stone-700 rounded-lg px-4 py-2.5 text-sm text-gray-200 focus:outline-none focus:border-gw2-gold-dark transition-colors"
                            autoFocus
                        />
                        {error && <p className="text-red-400 text-xs mt-2">{error}</p>}
                        <button type="submit" disabled={loading}
                            className="w-full mt-4 bg-gw2-gold-dark text-stone-900 font-bold text-sm px-4 py-2.5 rounded-lg hover:opacity-90 transition-opacity disabled:opacity-50">
                            {loading ? 'Verifying...' : 'Sign In'}
                        </button>
                    </form>
                </div>
            </div>
        );
    }

    function SubmissionsPanel() {
        const [data, setData] = useState(null);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);
        const [page, setPage] = useState(1);
        const [filters, setFilters] = useState({ category: '', source: '', mission_id: '', ip_hash: '' });
        const [deleting, setDeleting] = useState(null);
        const [selected, setSelected] = useState(new Set());
        const [bulkDeleting, setBulkDeleting] = useState(false);

        const load = useCallback(async () => {
            setLoading(true);
            setError(null);
            const params = new URLSearchParams({ page, limit: 50 });
            if (filters.category) params.set('category', filters.category);
            if (filters.source) params.set('source', filters.source);
            if (filters.mission_id) params.set('mission_id', filters.mission_id);
            if (filters.ip_hash) params.set('ip_hash', filters.ip_hash);
            try {
                const res = await adminFetch(`/submissions?${params}`);
                if (!res.ok) {
                    if (res.status === 401) {
                        setToken('');
                        window.location.reload();
                        return;
                    }
                    throw new Error('Failed to load');
                }
                setData(await res.json());
            } catch (err) {
                setError(err.message);
            }
            setLoading(false);
        }, [page, filters]);

        useEffect(() => { setSelected(new Set()); load(); }, [load]);

        async function handleDelete(id) {
            setDeleting(id);
            try {
                const res = await adminFetch(`/submissions/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    load();
                } else {
                    const d = await res.json();
                    alert(d.error || 'Delete failed');
                }
            } catch {
                alert('Network error');
            }
            setDeleting(null);
        }

        function updateFilter(key, value) {
            setFilters(prev => ({ ...prev, [key]: value }));
            setPage(1);
            setSelected(new Set());
        }

        function toggleSelect(id) {
            setSelected(prev => {
                const next = new Set(prev);
                if (next.has(id)) next.delete(id); else next.add(id);
                return next;
            });
        }

        function toggleSelectAll() {
            if (!data?.submissions) return;
            const pageIds = data.submissions.map(s => s.id);
            const allSelected = pageIds.every(id => selected.has(id));
            setSelected(prev => {
                const next = new Set(prev);
                pageIds.forEach(id => allSelected ? next.delete(id) : next.add(id));
                return next;
            });
        }

        async function handleBulkDelete() {
            if (selected.size === 0) return;
            if (!confirm(`Delete ${selected.size} submission${selected.size !== 1 ? 's' : ''}? This cannot be undone.`)) return;
            setBulkDeleting(true);
            try {
                const res = await adminFetch('/submissions/bulk-delete', {
                    method: 'POST',
                    body: JSON.stringify({ ids: [...selected] }),
                });
                if (res.ok) {
                    const result = await res.json();
                    setSelected(new Set());
                    load();
                } else {
                    const d = await res.json();
                    alert(d.error || 'Bulk delete failed');
                }
            } catch {
                alert('Network error');
            }
            setBulkDeleting(false);
        }

        const pagination = data?.pagination;

        return (
                <div className="max-w-6xl mx-auto px-4 py-6">
                    <h1 className="text-xl font-bold font-display mb-4" style={{color:'#e8e0d6'}}>Submissions</h1>

                    <div className="flex flex-wrap gap-3 mb-4">
                        <select value={filters.category} onChange={e => updateFilter('category', e.target.value)}
                            className="bg-stone-800 border border-stone-700 rounded-lg px-3 py-1.5 text-xs text-gray-300 focus:outline-none focus:border-gw2-gold-dark">
                            <option value="">All Categories</option>
                            <option value="full">Full Experience</option>
                            <option value="speed">Speedrun</option>
                        </select>
                        <select value={filters.source} onChange={e => updateFilter('source', e.target.value)}
                            className="bg-stone-800 border border-stone-700 rounded-lg px-3 py-1.5 text-xs text-gray-300 focus:outline-none focus:border-gw2-gold-dark">
                            <option value="">All Sources</option>
                            <option value="manual">Manual</option>
                            <option value="sentiment">Sentiment</option>
                            <option value="api">API</option>
                            <option value="blishhud">BlishHUD</option>
                        </select>
                        <input type="text" value={filters.mission_id} onChange={e => updateFilter('mission_id', e.target.value)}
                            placeholder="Mission ID"
                            className="bg-stone-800 border border-stone-700 rounded-lg px-3 py-1.5 text-xs text-gray-300 w-28 focus:outline-none focus:border-gw2-gold-dark"
                        />
                        <input type="text" value={filters.ip_hash} onChange={e => updateFilter('ip_hash', e.target.value)}
                            placeholder="IP Hash"
                            className="bg-stone-800 border border-stone-700 rounded-lg px-3 py-1.5 text-xs text-gray-300 font-mono w-36 focus:outline-none focus:border-gw2-gold-dark"
                        />
                        {(filters.category || filters.source || filters.mission_id || filters.ip_hash) && (
                            <button onClick={() => { setFilters({ category: '', source: '', mission_id: '', ip_hash: '' }); setPage(1); }}
                                className="text-xs text-gray-500 hover:text-gray-300 transition-colors">
                                Clear filters
                            </button>
                        )}
                        {pagination && (
                            <span className="text-xs text-gray-500 ml-auto self-center">
                                {pagination.total} submission{pagination.total !== 1 ? 's' : ''}
                            </span>
                        )}
                    </div>

                    {error && <div className="text-red-400 text-sm mb-4">{error}</div>}

                    {selected.size > 0 && (
                        <div className="flex items-center gap-3 mb-3 px-3 py-2 bg-red-900/20 border border-red-900/40 rounded-lg">
                            <span className="text-xs text-red-300 font-medium">
                                {selected.size} selected
                            </span>
                            <button onClick={handleBulkDelete} disabled={bulkDeleting}
                                className="text-xs bg-red-700 hover:bg-red-600 text-white font-medium px-3 py-1 rounded transition-colors disabled:opacity-50">
                                {bulkDeleting ? 'Deleting...' : `Delete ${selected.size}`}
                            </button>
                            <button onClick={() => setSelected(new Set())}
                                className="text-xs text-gray-400 hover:text-gray-200 transition-colors ml-auto">
                                Clear selection
                            </button>
                        </div>
                    )}

                    <div className="card-bg rounded-lg border border-stone-800 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-xs">
                                <thead>
                                    <tr className="border-b border-stone-800 text-gray-500 text-left">
                                        <th className="px-3 py-2.5 w-8">
                                            <input type="checkbox"
                                                checked={data?.submissions?.length > 0 && data.submissions.every(s => selected.has(s.id))}
                                                onChange={toggleSelectAll}
                                                className="accent-gw2-gold rounded cursor-pointer"
                                            />
                                        </th>
                                        <th className="px-3 py-2.5 font-medium">ID</th>
                                        <th className="px-3 py-2.5 font-medium">Mission</th>
                                        <th className="px-3 py-2.5 font-medium">Category</th>
                                        <th className="px-3 py-2.5 font-medium">Duration</th>
                                        <th className="px-3 py-2.5 font-medium">Avg</th>
                                        <th className="px-3 py-2.5 font-medium">Diff</th>
                                        <th className="px-3 py-2.5 font-medium">Source</th>
                                        <th className="px-3 py-2.5 font-medium">Date</th>
                                        <th className="px-3 py-2.5 font-medium">IP Hash</th>
                                        <th className="px-3 py-2.5 font-medium w-16"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {loading && !data ? (
                                        <tr><td colSpan={11} className="px-3 py-8 text-center text-gray-500">Loading...</td></tr>
                                    ) : !data?.submissions?.length ? (
                                        <tr><td colSpan={11} className="px-3 py-8 text-center text-gray-500">No submissions found</td></tr>
                                    ) : data.submissions.map(s => {
                                        const diff = s.avg_mins ? s.duration_mins - s.avg_mins : null;
                                        const diffPct = s.avg_mins ? ((diff / s.avg_mins) * 100) : null;
                                        const isOutlier = diffPct !== null && Math.abs(diffPct) > 50;
                                        return (
                                            <tr key={s.id} className={`border-b border-stone-800/50 hover:bg-white/[0.02] transition-colors ${isOutlier ? 'bg-red-900/10' : ''} ${selected.has(s.id) ? 'bg-gw2-gold-dark/10' : ''}`}>
                                                <td className="px-3 py-2">
                                                    <input type="checkbox"
                                                        checked={selected.has(s.id)}
                                                        onChange={() => toggleSelect(s.id)}
                                                        className="accent-gw2-gold rounded cursor-pointer"
                                                    />
                                                </td>
                                                <td className="px-3 py-2 text-gray-500 font-mono">{s.id}</td>
                                                <td className="px-3 py-2 max-w-[200px] truncate">
                                                    <button
                                                        onClick={() => updateFilter('mission_id', String(s.mission_id))}
                                                        className={`hover:text-gw2-gold-light transition-colors cursor-pointer ${filters.mission_id === String(s.mission_id) ? 'text-gw2-gold-light' : 'text-gray-200'}`}
                                                        title={`Filter by ${s.mission_name}`}
                                                    >
                                                        {s.mission_name}
                                                        <span className={`ml-1 ${filters.mission_id === String(s.mission_id) ? 'text-gw2-gold-dark' : 'text-gray-600'}`}>#{s.mission_id}</span>
                                                    </button>
                                                </td>
                                                <td className="px-3 py-2">
                                                    <span className={s.category === 'full' ? 'text-gw2-gold-light' : 'text-yellow-400'}>
                                                        {s.category === 'full' ? 'Full' : 'Speed'}
                                                    </span>
                                                </td>
                                                <td className="px-3 py-2 text-gray-200 font-mono">{s.duration_mins.toFixed(1)}m</td>
                                                <td className="px-3 py-2 text-gray-500 font-mono">{s.avg_mins ? s.avg_mins.toFixed(1) + 'm' : '—'}</td>
                                                <td className="px-3 py-2 font-mono">
                                                    {diffPct !== null ? (
                                                        <span className={Math.abs(diffPct) > 50 ? 'text-red-400 font-bold' : Math.abs(diffPct) > 25 ? 'text-yellow-400' : 'text-gray-500'}>
                                                            {diff > 0 ? '+' : ''}{diffPct.toFixed(0)}%
                                                        </span>
                                                    ) : '—'}
                                                </td>
                                                <td className="px-3 py-2"><SourceBadge source={s.source} /></td>
                                                <td className="px-3 py-2 text-gray-500 whitespace-nowrap">{formatDate(s.created_at)}</td>
                                                <td className="px-3 py-2 font-mono">
                                                    {s.ip_hash ? (
                                                        <button
                                                            onClick={() => updateFilter('ip_hash', s.ip_hash)}
                                                            className={`hover:text-gw2-gold-light transition-colors cursor-pointer ${filters.ip_hash === s.ip_hash ? 'text-gw2-gold-light' : 'text-gray-600'}`}
                                                            title={`Filter by ${s.ip_hash}`}
                                                        >
                                                            {s.ip_hash.slice(0, 8)}&hellip;
                                                        </button>
                                                    ) : '—'}
                                                </td>
                                                <td className="px-3 py-2">
                                                    <button
                                                        onClick={() => { if (confirm(`Delete submission #${s.id}?\n${s.mission_name} — ${s.duration_mins}m (${s.category})`)) handleDelete(s.id); }}
                                                        disabled={deleting === s.id}
                                                        className="text-red-500/60 hover:text-red-400 transition-colors disabled:opacity-30 text-xs font-medium"
                                                    >
                                                        {deleting === s.id ? '...' : 'Delete'}
                                                    </button>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {pagination && pagination.pages > 1 && (
                        <div className="flex items-center justify-between mt-4">
                            <button onClick={() => setPage(p => Math.max(1, p - 1))} disabled={page <= 1}
                                className="text-xs text-gray-400 hover:text-gray-200 disabled:opacity-30 disabled:cursor-not-allowed transition-colors">
                                &larr; Previous
                            </button>
                            <span className="text-xs text-gray-500">
                                Page {pagination.page} of {pagination.pages}
                            </span>
                            <button onClick={() => setPage(p => Math.min(pagination.pages, p + 1))} disabled={page >= pagination.pages}
                                className="text-xs text-gray-400 hover:text-gray-200 disabled:opacity-30 disabled:cursor-not-allowed transition-colors">
                                Next &rarr;
                            </button>
                        </div>
                    )}
                </div>
        );
    }

    function MissionsPanel() {
        const [seasons, setSeasons] = useState([]);
        const [selectedSeason, setSelectedSeason] = useState('');
        const [selectedStory, setSelectedStory] = useState('');
        const [missions, setMissions] = useState([]);
        const [loading, setLoading] = useState(true);
        const [missionsLoading, setMissionsLoading] = useState(false);
        const [error, setError] = useState(null);
        const [submitting, setSubmitting] = useState(false);
        const [form, setForm] = useState({ name: '', order: '', seed_full_mins: '', seed_speed_mins: '' });
        const [editing, setEditing] = useState({ id: null, field: null, value: '' });
        const [deleting, setDeleting] = useState(null);

        useEffect(() => {
            (async () => {
                setLoading(true);
                try {
                    const res = await adminFetch('/stories');
                    if (!res.ok) throw new Error('Failed to load stories');
                    setSeasons(await res.json());
                } catch (err) {
                    setError(err.message);
                }
                setLoading(false);
            })();
        }, []);

        const currentSeason = seasons.find(s => s.id === selectedSeason);
        const stories = currentSeason?.stories || [];
        const currentStory = stories.find(s => String(s.id) === selectedStory);

        const loadMissions = useCallback(async (storyId) => {
            if (!storyId) { setMissions([]); return; }
            setMissionsLoading(true);
            try {
                const res = await adminFetch(`/missions?story_id=${storyId}`);
                if (res.ok) setMissions(await res.json());
            } catch {}
            setMissionsLoading(false);
        }, []);

        useEffect(() => {
            if (selectedStory) loadMissions(selectedStory);
            else setMissions([]);
        }, [selectedStory, loadMissions]);

        function handleSeasonChange(val) {
            setSelectedSeason(val);
            setSelectedStory('');
            setMissions([]);
        }

        async function handleSubmit(e) {
            e.preventDefault();
            if (!selectedStory || !form.name.trim() || !form.order) return;
            setSubmitting(true);
            try {
                const res = await adminFetch('/missions', {
                    method: 'POST',
                    body: JSON.stringify({
                        story_id: parseInt(selectedStory, 10),
                        name: form.name.trim(),
                        order: parseInt(form.order, 10),
                        seed_full_mins: form.seed_full_mins ? parseFloat(form.seed_full_mins) : null,
                        seed_speed_mins: form.seed_speed_mins ? parseFloat(form.seed_speed_mins) : null,
                    }),
                });
                if (res.ok) {
                    setForm({ name: '', order: '', seed_full_mins: '', seed_speed_mins: '' });
                    loadMissions(selectedStory);
                    const updated = await adminFetch('/stories');
                    if (updated.ok) setSeasons(await updated.json());
                } else {
                    const d = await res.json();
                    alert(d.error || 'Failed to create mission');
                }
            } catch {
                alert('Network error');
            }
            setSubmitting(false);
        }

        function startEdit(m, field) {
            const val = field === 'name' ? m.name : (m[field] != null ? String(m[field]) : '');
            setEditing({ id: m.id, field, value: val });
        }

        async function saveEdit() {
            if (editing.id == null) return;
            const body = {};
            if (editing.field === 'name') {
                if (!editing.value.trim()) { setEditing({ id: null, field: null, value: '' }); return; }
                body.name = editing.value.trim();
            } else {
                body[editing.field] = editing.value === '' ? null : parseFloat(editing.value);
            }
            try {
                const res = await adminFetch(`/missions/${editing.id}`, {
                    method: 'PATCH',
                    body: JSON.stringify(body),
                });
                if (res.ok) loadMissions(selectedStory);
                else alert((await res.json()).error || 'Update failed');
            } catch { alert('Network error'); }
            setEditing({ id: null, field: null, value: '' });
        }

        function handleEditKeyDown(e) {
            if (e.key === 'Enter') saveEdit();
            else if (e.key === 'Escape') setEditing({ id: null, field: null, value: '' });
        }

        async function handleDeleteMission(m) {
            if (!confirm(`Delete manual mission #${m.id} "${m.name}"?\nAny submissions for this mission will also be deleted.`)) return;
            setDeleting(m.id);
            try {
                const res = await adminFetch(`/missions/${m.id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadMissions(selectedStory);
                    const updated = await adminFetch('/stories');
                    if (updated.ok) setSeasons(await updated.json());
                } else {
                    alert((await res.json()).error || 'Delete failed');
                }
            } catch { alert('Network error'); }
            setDeleting(null);
        }

        if (loading) return <div className="max-w-6xl mx-auto px-4 py-6 text-gray-500 text-sm">Loading...</div>;
        if (error) return <div className="max-w-6xl mx-auto px-4 py-6 text-red-400 text-sm">{error}</div>;

        const totalMissing = seasons.reduce((sum, s) => sum + s.stories.filter(st => st.mission_count === 0).length, 0);

        return (
                <div className="max-w-6xl mx-auto px-4 py-6">
                    <div className="flex items-center gap-3 mb-4">
                        <h1 className="text-xl font-bold font-display" style={{color:'#e8e0d6'}}>Missions</h1>
                        {totalMissing > 0 && (
                            <span className="text-[10px] px-2 py-0.5 rounded font-medium bg-amber-900/60 text-amber-300">
                                {totalMissing} {totalMissing === 1 ? 'story' : 'stories'} with no missions
                            </span>
                        )}
                    </div>

                    <div className="flex flex-wrap gap-3 mb-4">
                        <select value={selectedSeason} onChange={e => handleSeasonChange(e.target.value)}
                            className="bg-stone-800 border border-stone-700 rounded-lg px-3 py-1.5 text-xs text-gray-300 focus:outline-none focus:border-gw2-gold-dark">
                            <option value="">Select Season</option>
                            {seasons.map(s => (
                                <option key={s.id} value={s.id}>{s.name}</option>
                            ))}
                        </select>
                        {selectedSeason && (
                            <select value={selectedStory} onChange={e => setSelectedStory(e.target.value)}
                                className="bg-stone-800 border border-stone-700 rounded-lg px-3 py-1.5 text-xs text-gray-300 focus:outline-none focus:border-gw2-gold-dark">
                                <option value="">Select Story</option>
                                {stories.map(st => (
                                    <option key={st.id} value={String(st.id)}>
                                        {st.group_name ? `[${st.group_name}] ` : ''}{st.name} ({st.mission_count} mission{st.mission_count !== 1 ? 's' : ''})
                                    </option>
                                ))}
                            </select>
                        )}
                    </div>

                    {selectedSeason && !selectedStory && (
                        <div className="card-bg rounded-lg border border-stone-800 overflow-hidden">
                            <table className="w-full text-xs">
                                <thead>
                                    <tr className="border-b border-stone-800 text-gray-500 text-left">
                                        <th className="px-3 py-2.5 font-medium">Story</th>
                                        <th className="px-3 py-2.5 font-medium">Group</th>
                                        <th className="px-3 py-2.5 font-medium">Missions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {stories.map(st => (
                                        <tr key={st.id}
                                            onClick={() => setSelectedStory(String(st.id))}
                                            className={`border-b border-stone-800/50 hover:bg-white/[0.02] transition-colors cursor-pointer ${st.mission_count === 0 ? 'bg-amber-900/10' : ''}`}>
                                            <td className="px-3 py-2 text-gray-200">{st.name}</td>
                                            <td className="px-3 py-2 text-gray-500">{st.group_name || '—'}</td>
                                            <td className="px-3 py-2">
                                                <span className={st.mission_count === 0 ? 'text-amber-400 font-medium' : 'text-gray-500'}>
                                                    {st.mission_count}
                                                </span>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {selectedStory && (
                        <div>
                            <div className="card-bg rounded-lg border border-stone-800 overflow-hidden mb-4">
                                <table className="w-full text-xs">
                                    <thead>
                                        <tr className="border-b border-stone-800 text-gray-500 text-left">
                                            <th className="px-3 py-2.5 font-medium">ID</th>
                                            <th className="px-3 py-2.5 font-medium">Order</th>
                                            <th className="px-3 py-2.5 font-medium">Name</th>
                                            <th className="px-3 py-2.5 font-medium">Seed Full</th>
                                            <th className="px-3 py-2.5 font-medium">Seed Speed</th>
                                            <th className="px-3 py-2.5 font-medium">Type</th>
                                            <th className="px-3 py-2.5 font-medium w-16"></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {missionsLoading ? (
                                            <tr><td colSpan={7} className="px-3 py-8 text-center text-gray-500">Loading...</td></tr>
                                        ) : missions.length === 0 ? (
                                            <tr><td colSpan={7} className="px-3 py-8 text-center text-gray-500">No missions — add one below</td></tr>
                                        ) : missions.map(m => (
                                            <tr key={m.id} className="border-b border-stone-800/50 hover:bg-white/[0.02] transition-colors">
                                                <td className="px-3 py-2 text-gray-500 font-mono">{m.id}</td>
                                                <td className="px-3 py-2 text-gray-500 font-mono">{m.order}</td>
                                                <td className="px-3 py-2 text-gray-200 cursor-pointer" onClick={() => startEdit(m, 'name')}>
                                                    {editing.id === m.id && editing.field === 'name' ? (
                                                        <input type="text" value={editing.value} autoFocus
                                                            onChange={e => setEditing(p => ({ ...p, value: e.target.value }))}
                                                            onBlur={saveEdit} onKeyDown={handleEditKeyDown}
                                                            className="bg-stone-800 border border-gw2-gold-dark rounded px-2 py-0.5 text-xs text-gray-200 w-full focus:outline-none"
                                                        />
                                                    ) : m.name}
                                                </td>
                                                <td className="px-3 py-2 text-gray-500 font-mono cursor-pointer" onClick={() => startEdit(m, 'seed_full_mins')}>
                                                    {editing.id === m.id && editing.field === 'seed_full_mins' ? (
                                                        <input type="number" step="0.1" value={editing.value} autoFocus
                                                            onChange={e => setEditing(p => ({ ...p, value: e.target.value }))}
                                                            onBlur={saveEdit} onKeyDown={handleEditKeyDown}
                                                            className="bg-stone-800 border border-gw2-gold-dark rounded px-2 py-0.5 text-xs text-gray-200 w-16 focus:outline-none"
                                                        />
                                                    ) : (m.seed_full_mins != null ? m.seed_full_mins + 'm' : '—')}
                                                </td>
                                                <td className="px-3 py-2 text-gray-500 font-mono cursor-pointer" onClick={() => startEdit(m, 'seed_speed_mins')}>
                                                    {editing.id === m.id && editing.field === 'seed_speed_mins' ? (
                                                        <input type="number" step="0.1" value={editing.value} autoFocus
                                                            onChange={e => setEditing(p => ({ ...p, value: e.target.value }))}
                                                            onBlur={saveEdit} onKeyDown={handleEditKeyDown}
                                                            className="bg-stone-800 border border-gw2-gold-dark rounded px-2 py-0.5 text-xs text-gray-200 w-16 focus:outline-none"
                                                        />
                                                    ) : (m.seed_speed_mins != null ? m.seed_speed_mins + 'm' : '—')}
                                                </td>
                                                <td className="px-3 py-2">
                                                    {m.manual_id ? (
                                                        <span className="text-[10px] px-1.5 py-0.5 rounded font-medium bg-emerald-900/60 text-emerald-300">Manual</span>
                                                    ) : (
                                                        <span className="text-[10px] px-1.5 py-0.5 rounded font-medium bg-stone-700 text-gray-400">API</span>
                                                    )}
                                                </td>
                                                <td className="px-3 py-2">
                                                    {m.manual_id ? (
                                                        <button onClick={() => handleDeleteMission(m)} disabled={deleting === m.id}
                                                            className="text-red-500/60 hover:text-red-400 transition-colors disabled:opacity-30 text-xs font-medium">
                                                            {deleting === m.id ? '...' : 'Delete'}
                                                        </button>
                                                    ) : null}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>

                            <div className="card-bg rounded-lg border border-stone-800 p-4">
                                <h2 className="text-sm font-bold font-display mb-3" style={{color:'#e8e0d6'}}>Add Mission</h2>
                                <form onSubmit={handleSubmit} className="flex flex-wrap gap-3 items-end">
                                    <div>
                                        <label className="block text-[10px] text-gray-500 uppercase tracking-wider mb-1">Name</label>
                                        <input type="text" value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))}
                                            placeholder="Mission name"
                                            className="bg-stone-800 border border-stone-700 rounded-lg px-3 py-1.5 text-xs text-gray-300 w-52 focus:outline-none focus:border-gw2-gold-dark"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] text-gray-500 uppercase tracking-wider mb-1">Order</label>
                                        <input type="number" value={form.order} onChange={e => setForm(f => ({ ...f, order: e.target.value }))}
                                            placeholder="#"
                                            min="1"
                                            className="bg-stone-800 border border-stone-700 rounded-lg px-3 py-1.5 text-xs text-gray-300 w-16 focus:outline-none focus:border-gw2-gold-dark"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] text-gray-500 uppercase tracking-wider mb-1">Seed Full (min)</label>
                                        <input type="number" step="0.1" value={form.seed_full_mins} onChange={e => setForm(f => ({ ...f, seed_full_mins: e.target.value }))}
                                            placeholder="—"
                                            className="bg-stone-800 border border-stone-700 rounded-lg px-3 py-1.5 text-xs text-gray-300 w-20 focus:outline-none focus:border-gw2-gold-dark"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] text-gray-500 uppercase tracking-wider mb-1">Seed Speed (min)</label>
                                        <input type="number" step="0.1" value={form.seed_speed_mins} onChange={e => setForm(f => ({ ...f, seed_speed_mins: e.target.value }))}
                                            placeholder="—"
                                            className="bg-stone-800 border border-stone-700 rounded-lg px-3 py-1.5 text-xs text-gray-300 w-20 focus:outline-none focus:border-gw2-gold-dark"
                                        />
                                    </div>
                                    <button type="submit" disabled={submitting || !form.name.trim() || !form.order}
                                        className="bg-gw2-gold-dark text-stone-900 font-bold text-xs px-4 py-1.5 rounded-lg hover:opacity-90 transition-opacity disabled:opacity-50">
                                        {submitting ? 'Adding...' : 'Add Mission'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
        );
    }

    function App() {
        const [authed, setAuthed] = useState(!!getToken());
        const [view, setView] = useState('submissions');

        if (!authed) return <LoginForm onLogin={() => setAuthed(true)} />;

        const tabs = [
            { id: 'submissions', label: 'Submissions' },
            { id: 'missions', label: 'Missions' },
        ];

        return (
            <div className="min-h-screen pb-12">
                <nav className="card-bg border-b border-stone-800 sticky top-0 z-50">
                    <div className="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <a href="/" className="flex items-center gap-2 hover:opacity-80 transition-opacity">
                                <img src="/logo.svg" alt="" className="w-7 h-7 rounded" />
                                <span className="font-bold text-lg font-display" style={{color:'#e8e0d6'}}>Story Times</span>
                            </a>
                            <span className="text-xs bg-red-900/60 text-red-300 px-2 py-0.5 rounded font-medium">Admin</span>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="flex gap-1">
                                {tabs.map(t => (
                                    <button key={t.id} onClick={() => setView(t.id)}
                                        className={`text-xs px-3 py-1 rounded transition-colors ${view === t.id ? 'bg-stone-700 text-gray-200' : 'text-gray-500 hover:text-gray-300'}`}>
                                        {t.label}
                                    </button>
                                ))}
                            </div>
                            <button onClick={() => { setToken(''); window.location.reload(); }}
                                className="text-xs text-gray-500 hover:text-gray-300 transition-colors">
                                Sign Out
                            </button>
                        </div>
                    </div>
                </nav>
                {view === 'submissions' && <SubmissionsPanel />}
                {view === 'missions' && <MissionsPanel />}
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
